<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SuperLaundry</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "biru-utama": "#0052cc",
              "biru-muda": "#f0f5ff",
              "biru-teks": "#003380",
            },
          },
        },
      };
    </script>

    <script src="/assets/js/jquery.min.js"></script>
    <script src="/assets/js/alpine.js" defer></script>
  </head>
  <body class="bg-biru-muda min-h-screen flex items-center justify-center py-12 px-4">
    <div x-data="authLogin" class="max-w-md w-full bg-white p-8 md:p-10 rounded-xl shadow-2xl">
      <div class="mb-6">
        <a href="../index.html" class="inline-flex items-center text-biru-utama hover:text-blue-700 font-medium transition"> ← Kembali ke Home </a>
      </div>

      <div>
        <h2 class="text-center text-3xl font-extrabold text-biru-teks">Login Akun Anda</h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          Belum punya akun?
          <a href="register.html" class="font-medium text-biru-utama hover:text-blue-700"> Daftar di sini </a>
        </p>
      </div>

      <div x-show="errorMessage" x-transition class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-lg my-6" style="display: none">
        <p x-text="errorMessage"></p>
      </div>

      <div x-show="successMessage" x-transition class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-lg my-6" style="display: none">
        <p x-text="successMessage"></p>
      </div>

      <form class="mt-8 space-y-6" @submit.prevent="handleLogin">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Alamat Email</label>
          <input x-model="form.email" type="email" required class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="contoh@email.com" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Kata Sandi</label>
          <input x-model="form.password" type="password" required class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Kata Sandi Anda" />
        </div>

        <div>
          <button
            type="submit"
            :disabled="isLoading"
            class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-biru-utama hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300 disabled:opacity-50"
          >
            <span x-show="isLoading">Memproses...</span>
            <span x-show="!isLoading">Masuk</span>
          </button>
        </div>
      </form>
    </div>

    <script src="script.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </body>
</html>
