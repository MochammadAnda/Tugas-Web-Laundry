<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beli Paket - SuperLaundry</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <script src="./script.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { "biru-utama": "#0052cc", "biru-muda": "#f0f5ff", "biru-teks": "#003380" },
        },
      },
    };
  </script>
  <style>
    [x-cloak] {
      display: none !important;
    }

    .bg-biru {
      background-color: #1e3a8a;
    }

    .bg-biru-utama {
      background-color: #2563eb;
    }

    .text-biru-teks {
      color: #1e3a8a;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .sidebar-scroll::-webkit-scrollbar-track {
      background: #1e3a8a;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 4px;
    }
  </style>
</head>

<body class="bg-gray-100 font-sans antialiased" x-data="packageUserPage" x-cloak>
  <div class="flex min-h-screen">
    <aside
      class="w-64 bg-biru text-white flex flex-col fixed h-full transition-transform transform md:translate-x-0 z-30 shadow-2xl"
      :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
      <div class="p-6 border-b border-blue-600/50 text-center">
        <div class="w-16 h-16 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-3 text-blue-300">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <h3 class="font-bold text-lg tracking-wide truncate px-2" x-text="username"></h3>
        <span
          class="inline-block px-3 py-1 mt-1 text-xs font-semibold bg-blue-600/40 text-blue-200 rounded-full uppercase tracking-wider">Member</span>
      </div>

      <nav class="flex-grow p-4 space-y-2 overflow-y-auto sidebar-scroll">
        <a href="../../index.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 hover:bg-blue-800 text-blue-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
            </path>
          </svg>
          <span>Dashboard</span>
        </a>

        <div>
          <button @click="submenu.user = !submenu.user"
            class="w-full flex items-center justify-between px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100 bg-blue-800/50">
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
              </svg>
              <span>Pemesanan</span>
            </div>
            <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.user ? 'rotate-90' : ''" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </button>

          <div x-show="submenu.user" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
            <a href="../../index.html"
              class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Buat
              Pesanan Baru</a>
            <a href="../../index.html"
              class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Status
              Pesanan</a>
            <a href="../../index.html"
              class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Riwayat
              Pesanan</a>
          </div>

          <div class="pt-4 pb-1">
            <p class="px-4 text-xs font-bold text-blue-400 uppercase tracking-wider">Transaksi</p>
          </div>

          <a href="#"
            class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 bg-biru-utama font-semibold shadow-lg text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            <span>Beli Paket</span>
          </a>
        </div>
      </nav>

      <div class="p-4 border-t border-blue-600/50 bg-blue-900/20">
        <button @click="logout"
          class="flex items-center justify-center w-full px-4 py-2 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 transition shadow-md">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <div class="flex-grow flex flex-col md:ml-64 transition-all duration-300 min-h-screen">
      <header class="md:hidden bg-white shadow-sm h-16 flex items-center justify-between px-4 sticky top-0 z-20">
        <div class="font-bold text-biru-teks text-lg">SuperLaundry</div>
        <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-md hover:bg-gray-100 text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
          </svg>
        </button>
      </header>

      <main class="flex-grow p-6 md:p-10">
        <div class="mb-8">
          <h1 class="text-3xl font-bold text-biru-teks">Pilih Paket Laundry</h1>
          <p class="text-gray-500 mt-2">Berlangganan paket untuk harga yang lebih hemat dan praktis.</p>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mt-6 mb-10" x-data="purchaseForm">
          <h2 class="text-xl font-bold text-biru-teks mb-4">Form Pembelian Paket</h2>

          <!-- Dropdown Pilih Paket -->
          <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-1">Pilih Paket</label>
            <select class="w-full border rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500" x-model="selectedId"
              @change="updatePrice()">
              <option value="">-- Pilih Paket --</option>
              <template x-for="pkg in packageList" :key="pkg.id">
                <option :value="pkg.id" x-text="pkg.name"></option>
              </template>
            </select>
          </div>

          <!-- Harga -->
          <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-1">Harga</label>
            <input type="text" class="w-full border rounded-lg p-2 bg-gray-100 text-gray-600" x-model="price" disabled>
          </div>

          <!-- Tombol Beli -->
          <button @click="buyPackage"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
            <span>Beli Paket</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </div>


        <template x-if="isLoading">
          <div
            class="flex flex-col items-center justify-center py-20 bg-white rounded-xl shadow-sm border border-gray-100">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-gray-500">Memuat paket...</p>
          </div>
        </template>

        <template x-if="!isLoading && packages.length === 0">
          <div class="text-center py-20 bg-white rounded-xl shadow-sm border border-gray-100">
            <p class="text-gray-500 text-lg">Kamu belum membeli paket apapun.</p>
          </div>
        </template>

        <div class="mt-10 " x-data="packageUserPage">

          <h2 class="text-xl font-bold mb-4">Transaksi Pending</h2>

          <!-- Loading -->
          <template x-if="isLoading">
            <p class="text-gray-500 text-center">Memuat data...</p>
          </template>

          <!-- Jika data kosong -->
          <template x-if="!isLoading && pendingTransactions.length === 0">
            <div class="text-center py-10 bg-white rounded-xl shadow-sm border border-gray-100">
              <p class="text-gray-500">Belum ada transaksi pending.</p>
            </div>
          </template>

          <!-- Jika ada data -->
          <template x-if="pendingTransactions.length > 0">
            <div class="overflow-x-auto">
              <table class="min-w-full bg-white rounded-lg shadow">
                <thead>
                  <tr class="border-b">
                    <th class="py-3 px-4 text-left">ID</th>
                    <th class="py-3 px-4 text-left">Package ID</th>
                    <th class="py-3 px-4 text-left">Harga</th>
                    <th class="py-3 px-4 text-left">Status</th>
                    <th class="py-3 px-4 text-left">Tanggal</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="trx in pendingTransactions" :key="trx.id">
                    <tr class="border-b hover:bg-gray-50">
                      <td class="py-3 px-4" x-text="trx.id"></td>
                      <td class="py-3 px-4" x-text="trx.package_id"></td>
                      <td class="py-3 px-4" x-text="formatRupiah(trx.total_price)"></td>
                      <td class="py-3 px-4">
                        <span class="px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 text-sm">
                          Pending
                        </span>
                      </td>
                      <td class="py-3 px-4" x-text="new Date(trx.created_at).toLocaleString('id-ID')"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

        </div>

    </div>
    </main>
  </div>
  </div>
</body>

</html>
