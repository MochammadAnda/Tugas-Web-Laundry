<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beli Paket - SuperLaundry</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="./script.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { "biru-utama": "#0052cc", "biru-muda": "#f0f5ff", "biru-teks": "#003380" },
          },
        },
      };
    </script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      .bg-biru {
        background-color: #1e3a8a;
      }
      .bg-biru-utama {
        background-color: #2563eb;
      }
      .text-biru-teks {
        color: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }
    </style>
  </head>

  <body class="bg-gray-100 font-sans antialiased" x-data="packageUserPage" x-cloak>
    <div class="flex min-h-screen">
      <aside class="w-64 bg-biru text-white flex flex-col fixed h-full transition-transform transform md:translate-x-0 z-30 shadow-2xl" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
        <div class="p-6 border-b border-blue-600/50 text-center">
          <div class="w-16 h-16 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-3 text-blue-300">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <h3 class="font-bold text-lg tracking-wide truncate px-2" x-text="username"></h3>
          <span class="inline-block px-3 py-1 mt-1 text-xs font-semibold bg-blue-600/40 text-blue-200 rounded-full uppercase tracking-wider">Member</span>
        </div>

        <nav class="flex-grow p-4 space-y-2 overflow-y-auto sidebar-scroll">
          <a href="../../index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 hover:bg-blue-800 text-blue-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              ></path>
            </svg>
            <span>Dashboard</span>
          </a>

          <div>
            <button @click="submenu.user = !submenu.user" class="w-full flex items-center justify-between px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100 bg-blue-800/50">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span>Pemesanan</span>
              </div>
              <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.user ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>

            <div x-show="submenu.user" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
              <a href="../../index.html" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Buat Pesanan Baru</a>
              <a href="../../index.html" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Status Pesanan</a>
              <a href="../../index.html" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Riwayat Pesanan</a>
            </div>

            <div class="pt-4 pb-1"><p class="px-4 text-xs font-bold text-blue-400 uppercase tracking-wider">Transaksi</p></div>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 bg-biru-utama font-semibold shadow-lg text-white">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
              <span>Beli Paket</span>
            </a>
          </div>
        </nav>

        <div class="p-4 border-t border-blue-600/50 bg-blue-900/20">
          <button @click="logout" class="flex items-center justify-center w-full px-4 py-2 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 transition shadow-md">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <div class="flex-grow flex flex-col md:ml-64 transition-all duration-300 min-h-screen">
        <header class="md:hidden bg-white shadow-sm h-16 flex items-center justify-between px-4 sticky top-0 z-20">
          <div class="font-bold text-biru-teks text-lg">SuperLaundry</div>
          <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-md hover:bg-gray-100 text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
        </header>

        <main class="flex-grow p-6 md:p-10">
          <div class="mb-8">
            <h1 class="text-3xl font-bold text-biru-teks">Pilih Paket Laundry</h1>
            <p class="text-gray-500 mt-2">Berlangganan paket untuk harga yang lebih hemat dan praktis.</p>
          </div>

          <template x-if="isLoading">
            <div class="flex flex-col items-center justify-center py-20 bg-white rounded-xl shadow-sm border border-gray-100">
              <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
              <p class="text-gray-500">Memuat paket...</p>
            </div>
          </template>

          <template x-if="!isLoading && packages.length === 0">
            <div class="text-center py-20 bg-white rounded-xl shadow-sm border border-gray-100">
              <p class="text-gray-500 text-lg">Belum ada paket tersedia saat ini.</p>
            </div>
          </template>

          <div x-show="!isLoading && packages.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="pkg in packages" :key="pkg.id">
              <div class="bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-100 flex flex-col overflow-hidden group relative">
                <div class="p-6 flex-grow">
                  <div class="flex justify-between items-start mb-4">
                    <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Hemat</span>
                    <svg class="w-8 h-8 text-gray-200 group-hover:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                  </div>

                  <h3 class="text-xl font-bold text-gray-800 mb-2" x-text="pkg.name"></h3>
                  <p class="text-gray-500 text-sm mb-6 h-12 overflow-hidden" x-text="pkg.description || 'Tidak ada deskripsi'"></p>

                  <div class="flex flex-col mb-2">
                    <span class="text-xs text-gray-400 uppercase">Harga</span>
                    <span class="text-2xl font-bold text-biru-teks" x-text="formatRupiah(pkg.price)"></span>
                  </div>
                  <div class="text-sm text-gray-500 bg-gray-50 p-2 rounded-lg inline-block border border-gray-100">Kuota: <span class="font-bold text-gray-800" x-text="pkg.quota + ' Kg/Pcs'"></span></div>
                </div>

                <div class="p-4 bg-gray-50 border-t border-gray-100">
                  <button @click="openConfirmModal(pkg)" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-sm">
                    <span>Beli Sekarang</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </main>
      </div>

      <div x-show="isModalOpen" style="display: none" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" x-transition.opacity>
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden transform transition-all" @click.away="closeModal()">
          <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
            <h3 class="font-bold text-gray-800 text-lg">Konfirmasi Pembelian</h3>
            <button @click="closeModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
          </div>

          <div class="p-6">
            <p class="text-gray-600 mb-6 text-center">Apakah Anda yakin ingin membeli paket ini?</p>

            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 mb-6">
              <div class="flex justify-between mb-2">
                <span class="text-gray-500 text-sm">Paket</span>
                <span class="font-semibold text-biru-teks" x-text="selectedPackage?.name"></span>
              </div>
              <div class="flex justify-between pt-2 border-t border-blue-200 mt-2">
                <span class="text-gray-800 font-bold">Total Harga</span>
                <span class="font-bold text-blue-600 text-lg" x-text="selectedPackage ? formatRupiah(selectedPackage.price) : 0"></span>
              </div>
            </div>

            <div class="flex gap-3 justify-end">
              <button @click="closeModal()" class="px-4 py-2 text-gray-600 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg font-medium transition-colors">Batal</button>
              <button @click="processTransaction" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-md font-medium flex items-center gap-2 transition-colors disabled:opacity-70" :disabled="isProcessing">
                <span x-show="isProcessing" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                <span x-text="isProcessing ? 'Memproses...' : 'Bayar Sekarang'"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
