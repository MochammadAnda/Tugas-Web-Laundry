<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Transaksi Paket | SuperLaundry</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="./script.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: { colors: { "biru-utama": "#0052cc", "biru-muda": "#f0f5ff", "biru-teks": "#003380" } },
        },
      };
    </script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      .bg-biru {
        background-color: #1e3a8a;
      }
      .text-biru-teks {
        color: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }
    </style>
  </head>

  <body class="bg-gray-100 font-sans antialiased" x-data="packageAdminPage" x-cloak>
    <div class="flex min-h-screen">
      <aside class="w-64 bg-biru text-white flex flex-col fixed h-full transition-transform transform md:translate-x-0 z-30 shadow-2xl" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
        <div class="p-6 border-b border-blue-600/50 text-center">
          <div class="w-16 h-16 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-3 text-blue-300">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <h3 class="font-bold text-lg tracking-wide truncate px-2" x-text="username"></h3>
          <span class="inline-block px-3 py-1 mt-1 text-xs font-semibold bg-blue-600/40 text-blue-200 rounded-full uppercase tracking-wider">Admin</span>
        </div>

        <nav class="flex-grow p-4 space-y-2 overflow-y-auto sidebar-scroll">
          <a href="/dashboard/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 hover:bg-blue-800 text-blue-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              ></path>
            </svg>
            <span>Dashboard</span>
          </a>

          <div class="mt-2">
            <div>
              <div class="pt-2 pb-1">
                <p class="px-4 text-xs font-bold text-blue-400 uppercase tracking-wider">ADMIN AREA</p>
              </div>

              <button @click="submenu.master = !submenu.master" class="w-full flex items-center justify-between px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100 bg-blue-800/50">
                <div class="flex items-center gap-3">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"
                    ></path>
                  </svg>
                  <span>Master Data</span>
                </div>
                <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.master ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>
              <div x-show="submenu.master" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
                <a href="/dashboard/master-data/assets/index.html" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Assets</a>
                <a href="/dashboard/master-data/expenses/index.html" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Expense</a>
                <a href="/dashboard/master-data/packages/index.html" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Package</a>
                <a href="/dashboard/master-data/services/index.html" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30">Service</a>
              </div>
            </div>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 bg-biru-utama font-semibold shadow-lg text-white">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
              </svg>
              <span>Transaksi Paket</span>
            </a>
          </div>
        </nav>

        <div class="p-4 border-t border-blue-600/50 bg-blue-900/20">
          <button @click="logout" class="flex items-center justify-center w-full px-4 py-2 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 transition shadow-md">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <div class="flex-grow flex flex-col md:ml-64 transition-all duration-300 min-h-screen">
        <header class="md:hidden bg-white shadow-sm h-16 flex items-center justify-between px-4 sticky top-0 z-20">
          <div class="font-bold text-biru-teks text-lg">SuperLaundry Admin</div>
          <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-md hover:bg-gray-100 text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
        </header>

        <main class="flex-grow p-6 md:p-10">
          <div class="flex justify-between items-center mb-6">
            <div>
              <h3 class="text-2xl font-bold text-gray-800">Kelola Transaksi Paket</h3>
              <p class="text-sm text-gray-500">Validasi pembayaran paket member.</p>
            </div>
            <button @click="fetchTransactions()" class="text-blue-600 hover:text-blue-800 flex items-center gap-1 text-sm font-medium">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
              Refresh
            </button>
          </div>

          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider font-semibold border-b border-gray-100">
                  <tr>
                    <th class="px-6 py-4">ID</th>
                    <th class="px-6 py-4">Customer</th>
                    <th class="px-6 py-4">Paket</th>
                    <th class="px-6 py-4">Total Harga</th>
                    <th class="px-6 py-4">Tanggal</th>
                    <th class="px-6 py-4 text-center">Status</th>
                    <th class="px-6 py-4 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 text-sm">
                  <template x-if="isLoading">
                    <tr>
                      <td colspan="7" class="px-6 py-8 text-center text-gray-500">Memuat data...</td>
                    </tr>
                  </template>

                  <template x-if="!isLoading && transactions.length === 0">
                    <tr>
                      <td colspan="7" class="px-6 py-8 text-center text-gray-500">Belum ada transaksi paket.</td>
                    </tr>
                  </template>

                  <template x-for="trx in transactions" :key="trx.id">
                    <tr class="hover:bg-gray-50 transition-colors">
                      <td class="px-6 py-4 text-gray-500" x-text="'#' + trx.id"></td>
                      <td class="px-6 py-4 font-medium text-gray-900" x-text="trx.user?.name || 'User ' + trx.user_id"></td>
                      <td class="px-6 py-4 text-gray-700" x-text="trx.package?.name || 'Paket ID ' + trx.package_id"></td>
                      <td class="px-6 py-4 font-bold text-biru-teks" x-text="formatRupiah(trx.total_price)"></td>
                      <td class="px-6 py-4 text-gray-500 text-xs" x-text="formatDate(trx.created_at)"></td>

                      <td class="px-6 py-4 text-center">
                        <span
                          class="px-3 py-1 rounded-full text-xs font-bold"
                          :class="{
                                'bg-yellow-100 text-yellow-800': trx.status === 'PENDING',
                                'bg-green-100 text-green-800': trx.status === 'SUCCESS',
                                'bg-red-100 text-red-800': trx.status === 'FAILED'
                              }"
                          x-text="trx.status"
                        >
                        </span>
                      </td>

                      <td class="px-6 py-4 text-center">
                        <template x-if="trx.status === 'PENDING'">
                          <div class="flex justify-center items-center gap-2">
                            <button @click="updateStatus(trx.id, 'SUCCESS')" class="p-1.5 bg-green-50 text-green-600 hover:bg-green-100 rounded border border-green-200 transition-colors" title="Approve / Set Sukses">
                              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                            <button @click="updateStatus(trx.id, 'FAILED')" class="p-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded border border-red-200 transition-colors" title="Reject / Set Gagal">
                              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                          </div>
                        </template>

                        <template x-if="trx.status !== 'PENDING'">
                          <span class="text-gray-400 text-xs">-</span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>

      <div x-show="isSidebarOpen" @click="isSidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/50 z-20 md:hidden"></div>
    </div>
  </body>
</html>
