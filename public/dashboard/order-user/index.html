<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Laundry - SuperLaundry</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="./script.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { "biru-utama": "#0052cc", "biru-muda": "#f0f5ff", "biru-teks": "#003380" },
          },
        },
      };
    </script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      .bg-biru {
        background-color: #1e3a8a;
      }
      .text-biru-teks {
        color: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }
    </style>
  </head>

  <body class="bg-gray-100 font-sans antialiased" x-data="orderPage" x-init="init()" x-cloak>
    <div class="flex min-h-screen">
      <aside class="w-64 bg-biru text-white flex flex-col fixed h-full transition-transform transform md:translate-x-0 z-30 shadow-2xl" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
        <div class="p-6 border-b border-blue-600/50 text-center">
          <div class="w-16 h-16 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-3 text-blue-300">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <h3 class="font-bold text-lg tracking-wide truncate px-2" x-text="username"></h3>
          <span class="inline-block px-3 py-1 mt-1 text-xs font-semibold bg-blue-600/40 text-blue-200 rounded-full uppercase tracking-wider">Member</span>
        </div>

        <nav class="flex-grow p-4 space-y-2 overflow-y-auto sidebar-scroll">
          <a href="../../index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 hover:bg-blue-800 text-blue-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              ></path>
            </svg>
            <span>Dashboard</span>
          </a>

          <div>
            <div class="pt-4 pb-1"><p class="px-4 text-xs font-bold text-blue-400 uppercase tracking-wider">Transaksi</p></div>

            <a href="../package-user/index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 hover:bg-blue-800 text-blue-100">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
              <span>Beli Paket</span>
            </a>

            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 bg-biru-utama font-semibold shadow-lg text-white">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2m-14 7h14"></path>
              </svg>
              <span>Order Laundry</span>
            </a>
          </div>
        </nav>

        <div class="p-4 border-t border-blue-600/50 bg-blue-900/20">
          <button @click="logout" class="flex items-center justify-center w-full px-4 py-2 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 transition shadow-md">Logout</button>
        </div>
      </aside>

      <div class="flex-grow flex flex-col md:ml-64 transition-all duration-300 min-h-screen">
        <header class="md:hidden bg-white shadow-sm h-16 flex items-center justify-between px-4 sticky top-0 z-20">
          <div class="font-bold text-biru-teks text-lg">SuperLaundry</div>
          <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-md hover:bg-gray-100 text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
        </header>

        <main class="flex-grow p-6 md:p-10">
          <div class="mb-8">
            <h1 class="text-3xl font-bold text-biru-teks">Buat Pesanan Baru</h1>
            <p class="text-gray-500 mt-2">Isi formulir di bawah untuk memesan layanan laundry.</p>
          </div>

          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden max-w-2xl">
            <div class="p-8">
              <form @submit.prevent="submitOrder" class="space-y-6">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Pilih Layanan</label>
                  <select x-model="form.service_id" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
                    <option value="">-- Pilih Layanan Laundry --</option>
                    <template x-for="svc in services" :key="svc.id">
                      <option :value="svc.id" x-text="svc.name + ' (' + svc.unit + ')'"></option>
                    </template>
                  </select>
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-2">Jumlah (Kg / Pcs)</label>
                  <input type="number" x-model="form.qty" required min="1" step="0.1" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Contoh: 5" />
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-3">Metode Pembayaran</label>
                  <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                      <input type="radio" name="payment" value="cash" x-model="form.payment_method" class="peer sr-only" />
                      <div class="rounded-lg border-2 border-gray-200 p-4 hover:bg-gray-50 peer-checked:border-blue-600 peer-checked:bg-blue-50 transition-all text-center">
                        <div class="font-semibold text-gray-700 peer-checked:text-blue-700">Bayar Tunai / Transfer</div>
                        <div class="text-xs text-gray-500 mt-1">Bayar setelah order dibuat</div>
                      </div>
                    </label>
                    <label class="cursor-pointer">
                      <input type="radio" name="payment" value="package" x-model="form.payment_method" class="peer sr-only" />
                      <div class="rounded-lg border-2 border-gray-200 p-4 hover:bg-gray-50 peer-checked:border-blue-600 peer-checked:bg-blue-50 transition-all text-center">
                        <div class="font-semibold text-gray-700 peer-checked:text-blue-700">Gunakan Kuota Paket</div>
                        <div class="text-xs text-gray-500 mt-1">Potong dari paket aktif Anda</div>
                      </div>
                    </label>
                  </div>
                </div>

                <div x-show="form.payment_method === 'package'" x-transition class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                  <label class="block text-sm font-medium text-blue-800 mb-2">Pilih Paket Anda</label>

                  <template x-if="myPackages.length === 0">
                    <div class="text-sm text-red-600 bg-red-50 p-3 rounded border border-red-200">Anda belum memiliki paket aktif. Silakan beli paket terlebih dahulu atau pilih metode Bayar Tunai.</div>
                  </template>

                  <template x-if="myPackages.length > 0">
                    <select x-model="form.user_package_id" class="w-full px-4 py-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                      <option value="">-- Pilih Paket Kuota --</option>
                      <template x-for="pkg in myPackages" :key="pkg.id">
                        <option :value="pkg.id" x-text="getPackageName(pkg) + ' (Sisa: ' + getPackageQuota(pkg) + ')'"></option>
                      </template>
                    </select>
                  </template>
                </div>

                <div class="pt-4">
                  <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-transform transform active:scale-95 flex justify-center items-center gap-2"
                    :disabled="isProcessing"
                    :class="isProcessing ? 'opacity-70 cursor-not-allowed' : ''"
                  >
                    <span x-show="isProcessing" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
                    <span x-text="isProcessing ? 'Memproses Order...' : 'Buat Pesanan Sekarang'"></span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>

      <div x-show="isSidebarOpen" @click="isSidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/50 z-20 md:hidden"></div>
    </div>
  </body>
</html>
