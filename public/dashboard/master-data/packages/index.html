<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Data Package - SuperLaundry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="./script.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { "biru-utama": "#0052cc", "biru-muda": "#f0f5ff", "biru-teks": "#003380" },
          },
        },
      };
    </script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      .bg-biru {
        background-color: #1e3a8a;
      }
      .bg-biru-utama {
        background-color: #2563eb;
      }
      .text-biru-teks {
        color: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }
    </style>
  </head>

  <body class="bg-gray-100 font-sans antialiased" x-data="packagePage" x-cloak>
    <div class="flex min-h-screen">
      <aside class="w-64 bg-biru text-white flex flex-col fixed h-full transition-transform transform md:translate-x-0 z-30 shadow-2xl" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
        <div class="p-6 border-b border-blue-600/50 text-center">
          <div class="w-16 h-16 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-3 text-blue-300">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
          </div>
          <h3 class="font-bold text-lg tracking-wide truncate px-2" x-text="username"></h3>
          <span class="inline-block px-3 py-1 mt-1 text-xs font-semibold bg-blue-600/40 text-blue-200 rounded-full uppercase tracking-wider" x-text="user_role"></span>
        </div>

        <nav class="flex-grow p-4 space-y-2 overflow-y-auto sidebar-scroll">
          <a href="../../index.html" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200 hover:bg-blue-800 text-blue-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              ></path>
            </svg>
            <span>Dashboard</span>
          </a>

          <template x-if="user_role === 'admin'">
            <div>
              <div class="pt-2 pb-1">
                <p class="px-4 text-xs font-bold text-blue-400 uppercase tracking-wider">Admin Area</p>
              </div>

              <button @click="submenu.admin = !submenu.admin" class="w-full flex items-center justify-between px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100">
                <div class="flex items-center gap-3">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2m-14 7h14"></path>
                  </svg>
                  <span>Kelola Pesanan</span>
                </div>
                <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.admin ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>
              <div x-show="submenu.admin" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
                <template x-for="item in adminPesananMenu" :key="item.label">
                  <a :href="item.url" class="block px-4 py-2 text-sm rounded-r-lg transition-colors text-blue-300 hover:text-white hover:bg-blue-800/30" x-text="item.label"></a>
                </template>
              </div>

              <button @click="submenu.master = !submenu.master" class="w-full flex items-center justify-between px-4 py-3 mt-1 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100 bg-blue-800/50">
                <div class="flex items-center gap-3">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"
                    ></path>
                  </svg>
                  <span>Master Data</span>
                </div>
                <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.master ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>
              <div x-show="submenu.master" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
                <template x-for="item in adminMasterMenu" :key="item.label">
                  <a
                    :href="item.url"
                    class="block px-4 py-2 text-sm rounded-r-lg transition-colors"
                    :class="item.active ? 'text-white font-semibold bg-blue-700/50' : 'text-blue-300 hover:text-white hover:bg-blue-800/30'"
                    x-text="item.label"
                  ></a>
                </template>
              </div>

              <template x-for="menu in adminStaticMenu" :key="menu.label">
                <a
                  :href="menu.url ? menu.url : '#'"
                  @click="menu.url ? true : (event.preventDefault(), currentPage = menu.page)"
                  class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200"
                  :class="(currentPage === menu.page && !menu.url) ? 'bg-biru-utama font-semibold shadow-lg' : 'hover:bg-blue-800 text-blue-100'"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-html="menu.icon"></svg>
                  <span x-text="menu.label"></span>
                </a>
              </template>
            </div>
          </template>
        </nav>

        <div class="p-4 border-t border-blue-600/50 bg-blue-900/20">
          <a href="../../index.html" class="flex items-center justify-center w-full py-2 mb-2 text-sm font-medium text-blue-200 hover:text-white transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Ke Beranda
          </a>
          <button @click="logout" class="flex items-center justify-center w-full px-4 py-2 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 transition shadow-md">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <div class="flex-grow flex flex-col md:ml-64 transition-all duration-300 min-h-screen">
        <header class="md:hidden bg-white shadow-sm h-16 flex items-center justify-between px-4 sticky top-0 z-20">
          <div class="font-bold text-biru-teks text-lg">SuperLaundry</div>
          <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-md hover:bg-gray-100 text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
        </header>

        <main class="flex-grow p-6 md:p-10">
          <div class="flex justify-between items-center mb-6">
            <div>
              <h3 class="text-2xl font-bold text-gray-800">Master Package</h3>
              <p class="text-sm text-gray-500">Kelola paket laundry dan harga.</p>
            </div>
            <button @click="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm transition-all">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
              Tambah Paket
            </button>
          </div>

          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider font-semibold border-b border-gray-100">
                  <tr>
                    <th class="px-6 py-4">Nama Paket</th>
                    <th class="px-6 py-4">Deskripsi</th>
                    <th class="px-6 py-4">Harga</th>
                    <th class="px-6 py-4">Kuota (Kg/Pcs)</th>
                    <th class="px-6 py-4 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 text-sm">
                  <template x-if="isLoading">
                    <tr>
                      <td colspan="5" class="px-6 py-8 text-center text-gray-500">Sedang memuat data...</td>
                    </tr>
                  </template>
                  <template x-if="!isLoading && packagesList.length === 0">
                    <tr>
                      <td colspan="5" class="px-6 py-8 text-center text-gray-500">Belum ada data paket.</td>
                    </tr>
                  </template>

                  <template x-for="item in packagesList" :key="item.id">
                    <tr class="hover:bg-gray-50 transition-colors">
                      <td class="px-6 py-4 font-medium text-gray-900" x-text="item.name"></td>
                      <td class="px-6 py-4 text-gray-600" x-text="item.description || '-'"></td>
                      <td class="px-6 py-4 font-bold text-gray-700" x-text="formatRupiah(item.price)"></td>
                      <td class="px-6 py-4">
                        <span class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-semibold" x-text="item.quota"></span>
                      </td>
                      <td class="px-6 py-4 text-center">
                        <div class="flex justify-center items-center gap-2">
                          <button @click="editPackage(item)" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                          </button>
                          <button @click="deletePackage(item.id)" class="p-1.5 text-red-600 hover:bg-red-50 rounded transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                          </button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>

      <div x-show="isModalOpen" style="display: none" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" x-transition.opacity>
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden" @click.away="closeModal()">
          <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
            <h3 class="font-bold text-gray-800 text-lg" x-text="isEditing ? 'Edit Paket' : 'Tambah Paket Baru'"></h3>
            <button @click="closeModal()" class="text-gray-400 hover:text-gray-600">&times;</button>
          </div>

          <form @submit.prevent="savePackage" class="p-6 space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Paket</label>
              <input type="text" x-model="form.name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Contoh: Cuci Kering Setrika" />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
              <textarea x-model="form.description" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none h-24" placeholder="Keterangan detail paket..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Harga (Rp)</label>
                <input type="number" x-model="form.price" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0" />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kuota (Kg/Pcs)</label>
                <input type="number" x-model="form.quota" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0" />
              </div>
            </div>

            <div class="pt-4 flex justify-end gap-3">
              <button type="button" @click="closeModal()" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg">Batal</button>
              <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow" x-text="isLoading ? 'Menyimpan...' : 'Simpan Data'"></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
