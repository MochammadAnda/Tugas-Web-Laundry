<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SuperLaundry</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "biru-utama": "#0052cc",
              "biru-muda": "#f0f5ff",
              "biru-teks": "#003380",
            },
          },
        },
      };
    </script>
    <style>
      [x-cloak] {
        display: none !important;
      }
      .bg-biru {
        background-color: #1e3a8a;
      } /* Biru Teks */
      .bg-biru-utama {
        background-color: #2563eb;
      }
      .text-biru-teks {
        color: #1e3a8a;
      }
      /* Scrollbar kustom untuk sidebar */
      .sidebar-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: #1e3a8a;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }
    </style>
  </head>

  <body class="bg-gray-100 font-sans antialiased" x-data="dashboardPage" x-cloak>
    <div class="flex min-h-screen">
      <aside class="w-64 bg-biru text-white flex flex-col fixed h-full transition-transform transform md:translate-x-0 z-30 shadow-2xl" :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
        <div class="p-6 border-b border-blue-600/50 text-center">
          <div class="w-16 h-16 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-3 text-blue-300">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <h3 class="font-bold text-lg tracking-wide truncate px-2" x-text="username"></h3>
          <span class="inline-block px-3 py-1 mt-1 text-xs font-semibold bg-blue-600/40 text-blue-200 rounded-full uppercase tracking-wider" x-text="user_role"></span>
        </div>

        <nav class="flex-grow p-4 space-y-2 overflow-y-auto sidebar-scroll">
          <a
            href="#"
            @click.prevent="currentPage = 'dashboard'"
            class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200"
            :class="currentPage === 'dashboard' ? 'bg-biru-utama font-semibold shadow-lg' : 'hover:bg-blue-800 text-blue-100'"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
              ></path>
            </svg>
            <span>Dashboard</span>
          </a>

          <template x-if="user_role === 'user'">
            <div>
              <button
                @click="submenu.user = !submenu.user"
                class="w-full flex items-center justify-between px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100"
                :class="isUserPesananActive ? 'bg-blue-800/50' : ''"
              >
                <div class="flex items-center gap-3">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                  <span>Pemesanan</span>
                </div>
                <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.user ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>

              <div x-show="submenu.user" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
                <template x-for="item in userPesananMenu" :key="item.page">
                  <a
                    href="#"
                    @click.prevent="currentPage = item.page"
                    class="block px-4 py-2 text-sm rounded-r-lg transition-colors"
                    :class="currentPage === item.page ? 'text-white font-semibold bg-blue-700/50' : 'text-blue-300 hover:text-white hover:bg-blue-800/30'"
                    x-text="item.label"
                  >
                  </a>
                </template>
              </div>

              <div class="pt-4 pb-1">
                <p class="px-4 text-xs font-bold text-blue-400 uppercase tracking-wider">Transaksi</p>
              </div>
              <template x-for="item in userTransactionMenu" :key="item.page">
                <a
                  :href="item.url ? item.url : '#'"
                  @click="item.url ? true : (event.preventDefault(), currentPage = item.page)"
                  class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200"
                  :class="currentPage === item.page ? 'bg-biru-utama font-semibold shadow-lg' : 'hover:bg-blue-800 text-blue-100'"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-html="item.icon"></svg>
                  <span x-text="item.label"></span>
                </a>
              </template>
            </div>
          </template>

          <template x-if="user_role === 'admin'">
            <div>
              <div class="pt-2 pb-1">
                <p class="px-4 text-xs font-bold text-blue-400 uppercase tracking-wider">Admin Area</p>
              </div>

              <button
                @click="submenu.admin = !submenu.admin"
                class="w-full flex items-center justify-between px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100"
                :class="isAdminPesananActive ? 'bg-blue-800/50' : ''"
              >
                <div class="flex items-center gap-3">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2m-14 7h14"></path>
                  </svg>
                  <span>Kelola Pesanan</span>
                </div>
                <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.admin ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>

              <div x-show="submenu.admin" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
                <template x-for="item in adminPesananMenu" :key="item.page">
                  <a
                    href="#"
                    @click.prevent="currentPage = item.page"
                    class="block px-4 py-2 text-sm rounded-r-lg transition-colors"
                    :class="currentPage === item.page ? 'text-white font-semibold bg-blue-700/50' : 'text-blue-300 hover:text-white hover:bg-blue-800/30'"
                    x-text="item.label"
                  >
                  </a>
                </template>
              </div>

              <button
                @click="submenu.master = !submenu.master"
                class="w-full flex items-center justify-between px-4 py-3 mt-1 rounded-lg hover:bg-blue-800 transition-colors duration-200 text-blue-100"
                :class="isMasterDataActive ? 'bg-blue-800/50' : ''"
              >
                <div class="flex items-center gap-3">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"
                    ></path>
                  </svg>
                  <span>Master Data</span>
                </div>
                <svg class="w-4 h-4 transition-transform duration-200" :class="submenu.master ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
              </button>

              <div x-show="submenu.master" x-collapse class="pl-4 mt-1 space-y-1 border-l-2 border-blue-600 ml-4">
                <template x-for="item in adminMasterMenu" :key="item.page">
                  <!-- <a
                    href="#"
                    @click.prevent="currentPage = item.page"
                    class="block px-4 py-2 text-sm rounded-r-lg transition-colors"
                    :class="currentPage === item.page ? 'text-white font-semibold bg-blue-700/50' : 'text-blue-300 hover:text-white hover:bg-blue-800/30'"
                    x-text="item.label"
                  >
                  </a> -->
                  <a
                    :href="item.url ? item.url : '#'"
                    @click="item.url ? true : (event.preventDefault(), currentPage = item.page)"
                    class="block px-4 py-2 text-sm rounded-r-lg transition-colors"
                    :class="currentPage === item.page ? 'text-white font-semibold bg-blue-700/50' : 'text-blue-300 hover:text-white hover:bg-blue-800/30'"
                    x-text="item.label"
                  ></a>
                </template>
              </div>

              <template x-for="menu in adminStaticMenu" :key="menu.label">
                <a
                  :href="menu.url ? menu.url : '#'"
                  @click="menu.url ? true : (event.preventDefault(), currentPage = menu.page)"
                  class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors duration-200"
                  :class="(currentPage === menu.page && !menu.url) ? 'bg-biru-utama font-semibold shadow-lg' : 'hover:bg-blue-800 text-blue-100'"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-html="menu.icon"></svg>
                  <span x-text="menu.label"></span>
                </a>
              </template>
            </div>
          </template>
        </nav>

        <div class="p-4 border-t border-blue-600/50 bg-blue-900/20">
          <a href="../index.html" class="flex items-center justify-center w-full py-2 mb-2 text-sm font-medium text-blue-200 hover:text-white transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Ke Beranda
          </a>
          <button @click="logout" class="flex items-center justify-center w-full px-4 py-2 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 transition shadow-md">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <div class="flex-grow flex flex-col md:ml-64 transition-all duration-300 min-h-screen">
        <header class="md:hidden bg-white shadow-sm h-16 flex items-center justify-between px-4 sticky top-0 z-20">
          <div class="font-bold text-biru-teks text-lg">SuperLaundry</div>
          <button @click="isSidebarOpen = !isSidebarOpen" class="p-2 rounded-md hover:bg-gray-100 text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
        </header>

        <main class="flex-grow p-6 md:p-10">
          <div x-show="currentPage === 'dashboard'">
            <h1 class="text-3xl font-bold text-biru-teks mb-2">Selamat Datang, <span x-text="username"></span>!</h1>
            <p class="text-gray-500 mb-8">Berikut adalah ringkasan aktivitas hari ini.</p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                  <p class="text-sm text-gray-500 mb-1">Total Pesanan</p>
                  <h3 class="text-2xl font-bold text-gray-800">12</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                </div>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                  <p class="text-sm text-gray-500 mb-1">Sedang Proses</p>
                  <h3 class="text-2xl font-bold text-orange-600">4</h3>
                </div>
                <div class="p-3 bg-orange-50 text-orange-600 rounded-lg">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
              </div>
              <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <div>
                  <p class="text-sm text-gray-500 mb-1" x-text="user_role === 'admin' ? 'Total Pendapatan' : 'Total Pengeluaran'"></p>
                  <h3 class="text-2xl font-bold text-green-600">Rp 450.000</h3>
                </div>
                <div class="p-3 bg-green-50 text-green-600 rounded-lg">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <div x-show="currentPage !== 'dashboard'" x-cloak>
            <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100 text-center py-20">
              <h2 class="text-2xl font-bold text-gray-800 mb-2">Halaman <span class="text-blue-600 capitalize" x-text="currentPage.replace(/_/g, ' ')"></span></h2>
              <p class="text-gray-500">Konten untuk halaman ini belum tersedia.</p>
              <button @click="currentPage = 'dashboard'" class="mt-6 px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Kembali ke Dashboard</button>
            </div>
          </div>
        </main>
      </div>

      <div x-show="isSidebarOpen" @click="isSidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/50 z-20 md:hidden"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
